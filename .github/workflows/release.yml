# Build and verify all assets before creating a draft. Publish after review.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag to build into a draft release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify release versions
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a stable vX.Y.Z tag' }
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $iss = (Select-String -Path installer/ailimits.iss -Pattern '#define AppVersion "([^"]+)"').Matches[0].Groups[1].Value
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata/lockfile validation failed' }
          $package = $metadata.packages | Where-Object name -eq 'ailimits'
          if ($version -ne $cargo -or $version -ne $iss -or $version -ne $package.version) {
            throw "Version mismatch: tag=$version Cargo=$cargo installer=$iss lock=$($package.version)"
          }

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Build (release-min, Windows x64)
        run: cargo build --locked --profile release-min --bins

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Package installer, portable archive and checksums
        run: ./tools/package-release.ps1 -Version ($env:RELEASE_TAG -replace '^v', '')

      - name: Smoke-test installer on clean runner
        run: |
          $v = $env:RELEASE_TAG -replace '^v', ''
          $destination = Join-Path $env:RUNNER_TEMP 'AiLimits-install-check'
          $setup = (Resolve-Path "target/installer/AiLimits-Setup-$v.exe").Path
          $process = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/TASKS=""', "/DIR=`"$destination`"") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          foreach ($name in @('ailimits.exe', 'ailimits-auth.exe', 'README.md', 'README.zh-CN.md', 'LICENSE', 'TRADEMARKS.md')) {
            $source = if ($name.EndsWith('.exe')) { Join-Path 'target/release-min' $name } else { $name }
            if ((Get-FileHash $source).Hash -ne (Get-FileHash (Join-Path $destination $name)).Hash) {
              throw "Installed file mismatch: $name"
            }
          }
          & (Join-Path $destination 'ailimits-auth.exe') --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed authentication utility did not start' }

      - name: Extract release notes
        run: |
          $version = [regex]::Escape(($env:RELEASE_TAG -replace '^v', ''))
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?ms)^## $version(?:[^\r\n]*)\r?\n(.*?)(?=^## |\z)")
          if (-not $section.Success -or -not $section.Groups[1].Value.Trim()) {
            throw 'Missing release notes in CHANGELOG.md'
          }
          Set-Content target/release-notes.md $section.Groups[1].Value.Trim() -Encoding utf8

      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:RELEASE_TAG -replace '^v', ''
          $assets = @("target/installer/AiLimits-Setup-$v.exe", "target/installer/AiLimits-Portable-$v.zip", 'target/installer/SHA256SUMS.txt')
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Refusing to replace a published release' }
            gh release edit $env:RELEASE_TAG --title "AI Limits (study-233 fork) $env:RELEASE_TAG" --notes-file target/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not update draft notes' }
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title "AI Limits (study-233 fork) $env:RELEASE_TAG" --notes-file target/release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload draft assets' }

      - name: Verify uploaded draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:RELEASE_TAG -replace '^v', ''
          $destination = 'target/download-verification'
          New-Item -ItemType Directory -Force $destination | Out-Null
          gh release download $env:RELEASE_TAG --dir $destination --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not download draft assets' }
          $expectedNames = @("AiLimits-Setup-$v.exe", "AiLimits-Portable-$v.zip", 'SHA256SUMS.txt')
          $actualNames = @(Get-ChildItem $destination -File | ForEach-Object Name)
          if (Compare-Object $expectedNames $actualNames) { throw 'Unexpected or missing release assets' }
          foreach ($name in $expectedNames) {
            $built = (Get-FileHash (Join-Path 'target/installer' $name) -Algorithm SHA256).Hash
            $downloaded = (Get-FileHash (Join-Path $destination $name) -Algorithm SHA256).Hash
            if ($built -ne $downloaded) { throw "Uploaded asset hash mismatch: $name" }
          }
          'Draft assets downloaded and verified. Ready for publication as a stable Latest release.' | Out-File $env:GITHUB_STEP_SUMMARY -Append
